[package]
name = "vacuumdrop-cli"
description = "The p2p command-line interface"
version.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "p2p"
path = "src/main.rs"

# Argument parsing is hand-rolled rather than pulled from clap.
#
# Rationale (Charter 54 requires this be justified, not assumed):
#   - The Phase 1 surface is six subcommands with a handful of flags.
#   - clap would add a dependency, a proc-macro build step, and a compile-time
#     cost for something this small.
#   - Hand-rolled parsing here is ~120 lines, fully tested, and produces better
#     error messages for this specific CLI.
#
# Revisit if the surface grows materially: the moment subcommands gain nested
# flags, aliases, and completions, this becomes the wrong trade. Recorded as a
# deliberate decision, not an oversight.

[dependencies]
vacuumdrop-core = { path = "../../crates/vacuumdrop-core" }
vacuumdrop-protocol = { path = "../../crates/vacuumdrop-protocol" }
vacuumdrop-transport = { path = "../../crates/vacuumdrop-transport" }

tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "io-util",
    "time",
"signal",
] }

# Wi-Fi Direct support is Windows-only and opt-in.
#
# Two separate reasons it is NOT a plain dependency:
#
#   1. Portability. This binary is the portable front end; the platform crates are
#      the replaceable back end. A hard dependency would make `p2p` Windows-only,
#      which is the coupling Charter 47 exists to prevent.
#   2. Honesty. Real two-device P2P has not been validated yet (docs/roadmap.md
#      Phase 3). Default-on would ship a path that has never worked.
#
# Target-scoped as well as optional, so the `windows` crate is not even compiled on
# other platforms.
[target.'cfg(windows)'.dependencies]
vacuumdrop-platform-windows = { path = "../../crates/vacuumdrop-platform-windows", optional = true }

# Declared last so the tables above are read as dependencies, not features.
[features]
default = []
# Enables `p2p wifi-direct ...`. Requires Windows.
#
# Also turns on the adapter's own `discovery` feature, because the one-shot scan it
# provides is now real: `DeviceInformation::FindAllAsyncAqsFilter` needs no watcher
# and no event handlers. It is deliberately not left to the user as a second flag to
# remember - a CLI action that reports "unavailable" for a capability that works is
# worse than one more feature to carry.
wifi-direct = ["dep:vacuumdrop-platform-windows", "vacuumdrop-platform-windows/discovery"]