[package]
name = "vacuumdrop-platform-windows"
description = "Windows Wi-Fi Direct adapter for the VacuumDrop engine"
version.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

# THE ONLY CRATE PERMITTED TO TOUCH WinRT TYPES.
#
# Charter 47 and engineering-standards rule 5: platform-specific code stays thin
# and never leaks into the core. `scripts/check.ps1` enforces that no core crate
# depends on this one, and the adapter's public API exposes only plain Rust types.
#
# `windows` 0.62.2 - ratified by the Phase 3 spike (ADR-0009).
#
#   Q1 Does it expose Windows.Devices.WiFiDirect?   YES - module present with
#      WiFiDirectDevice, WiFiDirectAdvertisementPublisher, WiFiDirectConnection-
#      Parameters, WiFiDirectConnectionListener. NOTE: `WiFiDirectDeviceListWatcher`
#      is NOT in the binding; peer enumeration uses `DeviceInformation` +
#      `DeviceWatcher::Added` under the `discovery` feature.
#   Q2 How are IAsyncOperation completions awaited?  Via `IntoFuture`, which
#      `windows-future` 0.3 implements for `IAsyncOperation<T>` (its
#      src/future.rs). So the call is `.into_future().await` - it is an
#      `IntoFuture`, NOT a `Future`, which is why a bare `.await` does not
#      compile. Composes directly with `tokio::time::timeout` for the deadline.
#      `windows_future::join()` was rejected: it blocks the calling thread and
#      would deadlock a Tokio worker.
#   Q3 Static IP or DHCP after group formation?       DHCP is sufficient:
#      WiFiDirectDevice::GetConnectionEndpointPairs yields the assigned endpoint,
#      and EndpointPair::RemoteHostName carries the peer's address. Plausible from
#      the API; still to be confirmed on real hardware.
#   Q4 Practical unsafe count?                        Zero unsafe in this crate's own
#      code; the generated bindings encapsulate theirs internally. The crate
#      compiles under `#![forbid(unsafe_code)]`.
#
# Justification for the dependency (Charter 54): there is no reasonable
# alternative for WinRT from Rust. `windows` is generated by Microsoft, MIT or
# Apache-2.0, and the alternative - a C#/WinRT helper behind a C ABI - would add
# a second language and an IPC hop for no benefit now that the spike confirms the
# direct path works. Full rationale: docs/dep-justification.md.

[dependencies]
vacuumdrop-core = { path = "../vacuumdrop-core" }

# Per-crate feature selection, not `full` (ADR-0002 section 4.1).
# Feature names verified against windows 0.62.2's own Cargo.toml. Note that
# `Windows.Devices.Networking.NetworkAdapter` lives under the `Networking`
# feature, not `Devices_Networking` - the latter does not exist.
windows = { version = "0.62", default-features = false, features = [
    "Foundation",
    "Foundation_Collections",
    "Devices",
    "Devices_Enumeration",
    "Devices_WiFiDirect",
    "Networking",
] }
thiserror = "2"

# `windows-future` is required directly, not via a re-export: it is what
# implements `IntoFuture` for `IAsyncOperation<T>` (ADR-0009 Q2). Only the `std`
# feature - runtime integration is ours via `tokio::time::timeout`.
windows-future = { version = "0.3", features = ["std"] }

# `oneshot` only. The adapter needs no timers, sockets, or filesystem: the engine
# owns those, and adding features here would silently widen the platform crate's
# surface (ADR-0002 section 4.1).
# `time` for `tokio::time::timeout`, which is how Charter 65's deadline is
# enforced on a WinRT future. `sync` alone would not compile. Nothing else is
# needed: the adapter does no networking, filesystem, or process work, and a
# narrower feature set here keeps the platform crate's surface honest
# (ADR-0002 section 4.1).
tokio = { version = "1", default-features = false, features = ["time"] }

# Opt-in watcher-based peer discovery. Off by default: it needs the
# `DeviceInformation` watcher machinery, and shipping it enabled would let the CLI
# show a discovery path that has not been validated on real hardware.
[features]
default = []
discovery = []

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }